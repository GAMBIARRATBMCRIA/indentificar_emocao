<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma de Reconhecimento de Emoções em Texto (PT-BR) usando Deep Learning">
    <title>SenseAI - Identificador de Emoções</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-mesh"></div>
    
    <main class="container">
        <header>
            <div class="logo-wrapper">
                <span class="logo-icon">✨</span>
            </div>
            <h1>SenseAI</h1>
            <p>Descubra a emoção predominante em qualquer texto utilizando Inteligência Artificial</p>
        </header>

        <section class="input-section glass-panel">
            <div style="text-align: center; margin-bottom: 25px;">
                <img src="img/barber.png" alt="Barbeiro e cliente" style="width: 100%; max-width: 400px; height: auto; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); margin-bottom: 15px;">
                <p style="font-size: 1.2rem; font-weight: 600; color: var(--text-main); font-style: italic;">"Como você quer se sentir hoje?"</p>
            </div>
            <form id="emotion-form">
                <label for="text-input" class="sr-only">Digite seu texto</label>
                <textarea 
                    id="text-input" 
                    placeholder="Digite seu comentário ou texto aqui (ex: Estou muito feliz com essa novidade!)..."
                    required
                    minlength="2"
                    maxlength="5000"
                ></textarea>
                
                <div class="actions">
                    <span class="char-count" id="char-count">0 / 5000</span>
                    <button type="submit" id="analyze-btn">
                        <span class="btn-text">Analisar Emoção</span>
                        <div class="loader hidden" id="btn-loader"></div>
                    </button>
                </div>
            </form>
            <div id="error-message" class="error-toast hidden"></div>
        </section>

        <section class="results-section hidden" id="results-section">
            <div class="primary-result glass-panel" id="primary-result-card">
                <div class="emotion-header">
                    <h2 class="result-title">Emoções Detectadas</h2>
                </div>
                <div class="emotion-display" id="detected-emotions-container" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px;">
                    <!-- Tags de emoções inseridas via JS -->
                </div>
            </div>

            <div class="probabilities-panel glass-panel">
                <h3>Probabilidades Detalhadas</h3>
                <div class="bars-container" id="bars-container">
                    <!-- Barras injetadas via JS -->
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
